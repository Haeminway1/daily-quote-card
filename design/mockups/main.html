<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>좋은생각카드</title>
  <style>
    :root {
      --qc-bg: #f5f7fb;
      --qc-surface: #ffffff;
      --qc-paper: #fff8d8;
      --qc-paper-edge: #f0c84b;
      --qc-ink: #111827;
      --qc-muted: #566070;
      --qc-subtle: #e2e8f0;
      --qc-accent: #fece14;
      --qc-accent-ink: #111827;
      --qc-teal: #0f766e;
      --qc-focus: #2563eb;
      --qc-radius-sm: 8px;
      --qc-radius-md: 10px;
      --qc-radius-lg: 14px;
      --qc-space-1: 4px;
      --qc-space-2: 8px;
      --qc-space-3: 12px;
      --qc-space-4: 16px;
      --qc-space-5: 20px;
      --qc-space-6: 24px;
      --qc-shadow-card: 0 16px 38px rgba(17, 24, 39, 0.14);
      --qc-shadow-soft: 0 8px 22px rgba(17, 24, 39, 0.08);
      --qc-font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--qc-bg);
      color: var(--qc-ink);
      font-family: var(--qc-font);
      letter-spacing: 0;
    }

    body {
      min-height: 100dvh;
    }

    button {
      font: inherit;
    }

    .app-shell {
      width: min(100%, 375px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 18px 18px max(22px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: var(--qc-space-5);
    }

    .app-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--qc-space-3);
      padding-top: max(8px, env(safe-area-inset-top));
    }

    .title-group {
      min-width: 0;
    }

    .kicker {
      margin: 0 0 var(--qc-space-1);
      color: var(--qc-teal);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    h1 {
      margin: 0;
      color: var(--qc-ink);
      font-size: 27px;
      font-weight: 800;
      line-height: 1.25;
    }

    .deck-count {
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 1px solid var(--qc-subtle);
      border-radius: var(--qc-radius-sm);
      background: var(--qc-surface);
      color: var(--qc-muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      box-shadow: var(--qc-shadow-soft);
    }

    .deck-zone {
      position: relative;
      min-height: 214px;
      padding: 8px 0 0;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .deck-button {
      position: relative;
      width: min(100%, 246px);
      height: 178px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .deck-button:focus-visible {
      outline: 3px solid var(--qc-focus);
      outline-offset: 12px;
      border-radius: var(--qc-radius-md);
    }

    .deck-card {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: 2px solid var(--qc-paper-edge);
      border-radius: var(--qc-radius-lg);
      background: var(--qc-paper);
      box-shadow: var(--qc-shadow-card);
      color: var(--qc-ink);
      transform-origin: 50% 100%;
    }

    .deck-card:nth-child(1) {
      transform: translate(-14px, 16px) rotate(-5deg);
      background: #ffffff;
      border-color: var(--qc-subtle);
      z-index: 1;
    }

    .deck-card:nth-child(2) {
      transform: translate(11px, 10px) rotate(4deg);
      background: #fafdff;
      border-color: var(--qc-subtle);
      z-index: 2;
    }

    .deck-card:nth-child(3) {
      transform: translate(-2px, 4px) rotate(-1deg);
      z-index: 3;
    }

    .deck-card.is-drawing {
      transform: translateX(42px) translateY(-12px) rotate(7deg);
      z-index: 4;
    }

    .deck-face {
      display: grid;
      gap: var(--qc-space-2);
      justify-items: center;
      text-align: center;
    }

    .deck-mark {
      width: 42px;
      height: 5px;
      border-radius: 999px;
      background: var(--qc-ink);
    }

    .deck-label {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
    }

    .draw-path {
      position: absolute;
      right: 11px;
      bottom: 12px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--qc-muted);
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
    }

    .draw-line {
      width: 46px;
      height: 2px;
      background: var(--qc-subtle);
      border-radius: 999px;
    }

    .draw-arrow {
      width: 9px;
      height: 9px;
      border-top: 2px solid var(--qc-muted);
      border-right: 2px solid var(--qc-muted);
      transform: rotate(45deg);
    }

    .quote-card {
      width: 100%;
      max-height: min(338px, calc(100dvh - 386px));
      overflow-y: auto;
      border: 2px solid var(--qc-paper-edge);
      border-radius: var(--qc-radius-lg);
      background: var(--qc-paper);
      box-shadow: var(--qc-shadow-card);
      padding: var(--qc-space-5);
      scrollbar-width: thin;
      scrollbar-color: var(--qc-paper-edge) transparent;
    }

    .quote-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--qc-space-3);
      margin-bottom: var(--qc-space-4);
      color: var(--qc-muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .quote-state {
      color: var(--qc-teal);
    }

    .quote-text {
      margin: 0;
      color: var(--qc-ink);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.62;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .quote-author {
      margin: var(--qc-space-4) 0 0;
      color: var(--qc-muted);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      text-align: right;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--qc-space-3);
      margin-top: auto;
    }

    .redraw-button {
      min-height: 50px;
      padding: 0 var(--qc-space-5);
      border: 1px solid #d6a900;
      border-radius: var(--qc-radius-sm);
      background: var(--qc-accent);
      color: var(--qc-accent-ink);
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
      box-shadow: var(--qc-shadow-soft);
      cursor: pointer;
    }

    .redraw-button:focus-visible {
      outline: 3px solid var(--qc-focus);
      outline-offset: 3px;
    }

    .quiet-meta {
      min-width: 0;
      color: var(--qc-muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      text-align: right;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 420px) {
      .app-shell {
        width: min(100%, 480px);
        padding-inline: var(--qc-space-6);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }

      .deck-card.is-drawing {
        transform: translateX(18px);
      }
    }
  </style>
</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <header class="app-header">
      <div class="title-group">
        <p class="kicker">오늘의 카드</p>
        <h1 id="app-title">좋은생각카드</h1>
      </div>
      <div class="deck-count" aria-label="공개 카드 103장">103장</div>
    </header>

    <section class="deck-zone" aria-label="명언 카드 덱">
      <button class="deck-button" type="button" aria-label="명언 카드 뽑기">
        <span class="deck-card" aria-hidden="true"></span>
        <span class="deck-card" aria-hidden="true"></span>
        <span class="deck-card" aria-hidden="true">
          <span class="deck-face">
            <span class="deck-mark"></span>
            <span class="deck-label">뽑기</span>
          </span>
        </span>
        <span class="deck-card is-drawing" aria-hidden="true">
          <span class="deck-face">
            <span class="deck-mark"></span>
            <span class="deck-label">뽑기</span>
          </span>
        </span>
      </button>
      <div class="draw-path" aria-hidden="true">
        <span class="draw-line"></span>
        <span class="draw-arrow"></span>
      </div>
    </section>

    <section class="quote-card" aria-labelledby="quote-title">
      <div class="quote-meta">
        <span id="quote-title">펼쳐진 카드</span>
        <span class="quote-state">준비됨</span>
      </div>
      <p class="quote-text">
        오늘 할 수 있는 작은 일을 정성껏 마치면, 아직 보이지 않던 다음 길도
        조용히 모습을 드러낸다. 조급함보다 꾸준함을 선택하는 마음이 하루를
        가장 단단하게 만든다.
      </p>
      <p class="quote-author">미상</p>
    </section>

    <div class="actions">
      <button class="redraw-button" type="button">다시 뽑기</button>
      <div class="quiet-meta">이전 카드와 겹치지 않게</div>
    </div>

    <p class="sr-only" aria-live="polite">새 명언 카드가 열렸습니다.</p>
  </main>
</body>
</html>
