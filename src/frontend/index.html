<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <base target="_top">
  <title>좋은생각카드</title>
  <script data-source="pwa-frame-guard">
    (function () {
      var allowedOrigins = ['__WRAPPER_ORIGIN__'];
      var state = { verified: false, verifiedOrigin: '', allowedOrigins: allowedOrigins.slice() };
      window.GAS_FRAME_GUARD = state;
      function isFramed() {
        try { return window.self !== window.top; } catch (_) { return true; }
      }
      function isTrustedWrapperOrigin(origin) {
        if (!origin || origin === 'null') return false;
        if (allowedOrigins.indexOf(origin) !== -1) return true;
        return /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(origin);
      }
      function mark(status, origin) {
        document.documentElement.dataset.gasFrameGuard = status;
        state.verified = status === 'verified' || status === 'direct' || status === 'framed-allowed';
        state.verifiedOrigin = origin || '';
        window.GAS_FRAME_GUARD_VERIFIED = state.verified;
      }
      if (!isFramed()) {
        mark('direct', '');
        return;
      }
      mark('pending', '');
      var fallbackTimer = window.setTimeout(function () {
        if (!state.verified) mark('framed-allowed', '');
      }, 1500);
      window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (!data || data.type !== 'GAS_WRAPPER_READY') return;
        if (!isTrustedWrapperOrigin(event.origin)) return;
        window.clearTimeout(fallbackTimer);
        mark('verified', event.origin);
        try {
          if (event.source && typeof event.source.postMessage === 'function') {
            event.source.postMessage({ type: 'GAS_FRAME_VERIFIED', app: 'quotecard', origin: window.location.origin }, event.origin);
          }
        } catch (_) {}
      });
    })();
  </script>
  <?!= include('css') ?>
</head>
<body data-test-page="mobile-viewport">
<div class="page">
  <main class="shell" data-test-id="app-shell" role="application" aria-label="좋은생각카드">

    <header class="topbar">
      <div class="brand">
        <span class="eyebrow">오늘의 카드</span>
        <h1 class="title">좋은생각카드</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="openCal" data-test-id="memo-calendar" aria-label="메모 달력" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
        </button>
        <button class="icon-btn" id="openAddTop" data-test-id="add-quote" aria-label="명언 추가" aria-haspopup="dialog"><span class="plus">＋</span></button>
      </div>
    </header>

    <section class="deck-area">
      <div class="deck" id="deck" data-test-id="quote-deck"
           role="button" tabindex="0"
           aria-label="명언 카드 뽑기"
           aria-keyshortcuts="Enter Space">
        <div class="belt" id="belt"></div>
        <div class="card draw" id="drawCard" aria-hidden="true" style="opacity:0"></div>
      </div>
      <p class="hint" id="hint"><span class="dot"></span>원하는 카드를 아래로 당겨 뽑으세요</p>
    </section>

    <section class="result" id="result">
      <div class="ready-state" id="ready">
        흐르는 카드 중 마음에 닿는 한 장을 뽑아보세요.<br><b>오늘의 좋은 생각</b>이 도착합니다.
      </div>
      <article class="quote-card" id="quoteCard" data-test-id="quote-card" data-state="ready" hidden>
        <button class="quote-dismiss" id="quoteDismiss" data-test-id="quote-dismiss" type="button" aria-label="명언 카드 내리기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="quote-mark">&ldquo;</div>
        <p class="quote-text" id="quoteText" data-test-id="quote-text"></p>
        <p class="quote-author" id="quoteAuthor" data-test-id="quote-author"></p>
      </article>
      <div class="memo-cta" id="memoCta" hidden>
        <button class="btn primary full" id="memoBtn" data-test-id="memo-open" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          내 생각 메모
        </button>
      </div>
    </section>

    <div class="vh" id="live" data-test-id="quote-announcement" aria-live="polite" role="status"></div>
  </main>
</div>

<!-- ============ sheet: 명언 추가 ============ -->
<div class="sheet-root" id="addRoot" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="grabber"></div>
    <h2 id="addTitle">명언 추가</h2>
    <p class="sub">나만의 좋은 생각을 덱에 더해보세요.</p>
    <div class="field" id="addField">
      <label for="qText">명언<span class="counter" id="textCount">0/120</span></label>
      <textarea id="qText" data-test-id="add-quote-text" maxlength="120" placeholder="마음에 새기고 싶은 문장을 적어주세요." aria-describedby="textErr"></textarea>
      <p class="err-msg" id="textErr">명언 내용을 입력해주세요.</p>
    </div>
    <div class="field">
      <label for="qAuthor">작가 또는 출처 <span class="opt">(선택)</span></label>
      <input id="qAuthor" data-test-id="add-quote-author" type="text" maxlength="40" placeholder="비워두면 ‘미상’으로 저장돼요." />
    </div>
    <div class="sheet-actions">
      <button class="btn cancel" id="addCancel" type="button">취소</button>
      <button class="btn primary" id="addSave" data-test-id="save-quote" type="button">추가</button>
    </div>
  </div>
</div>

<!-- ============ sheet: 내 생각 메모 ============ -->
<div class="sheet-root" id="memoRoot" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="memoTitle">
    <div class="grabber"></div>
    <h2 id="memoTitle">내 생각 메모</h2>
    <p class="sub" id="memoWhen"></p>
    <div class="memo-quote">
      <p class="mq-text" id="memoQuoteText"></p>
      <p class="mq-author" id="memoQuoteAuthor"></p>
    </div>
    <div class="field" id="memoField">
      <label for="memoText">내 생각<span class="counter" id="memoCount">0/300</span></label>
      <textarea id="memoText" data-test-id="memo-text" maxlength="300" placeholder="이 명언에 떠오른 생각을 자유롭게 적어보세요." aria-describedby="memoErr"></textarea>
      <p class="err-msg" id="memoErr">메모 내용을 입력해주세요.</p>
    </div>
    <div class="sheet-actions">
      <button class="btn cancel" id="memoCancel" type="button">취소</button>
      <button class="btn primary" id="memoSave" data-test-id="memo-save" type="button">저장</button>
    </div>
  </div>
</div>

<!-- ============ sheet: 메모 달력 ============ -->
<div class="sheet-root" id="calRoot" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="calTitle">
    <div class="grabber"></div>
    <div id="calMonthView">
      <div class="cal-head"><h2 id="calTitle">메모 달력</h2></div>
      <div class="cal-nav">
        <button class="cal-arrow" id="calPrev" aria-label="이전 달" type="button">‹</button>
        <span class="cal-month" id="calMonthLabel"></span>
        <button class="cal-arrow" id="calNext" aria-label="다음 달" type="button">›</button>
      </div>
      <div class="cal-week"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="cal-empty" id="calEmpty" hidden>이 달엔 아직 작성한 메모가 없어요.</p>
    </div>
    <div id="calDayView" hidden>
      <div class="cal-head"><button class="cal-back" id="calBack" type="button">‹ 달력으로</button></div>
      <h2 id="calDayTitle"></h2>
      <div class="day-list" id="dayList"></div>
    </div>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
  <span id="toastMsg"></span>
</div>
  <?!= include('js') ?>
</body>
</html>
